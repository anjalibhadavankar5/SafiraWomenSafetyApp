name: Safira CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Check project files
        run: |
          echo "=== Safira File Check ==="
          ls -la
          echo "✅ Files verified"

      - name: Validate HTML
        run: |
          if [ -f "index.html" ]; then
            echo "✅ index.html found"
          else
            echo "❌ index.html missing"
            exit 1
          fi

      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          docker build -t safira-app .
          echo "✅ Docker image built"

      - name: Test Container
        run: |
          docker run -d -p 8080:80 --name safira-test safira-app
          sleep 3
          curl -f http://localhost:8080
          echo "✅ App running on port 8080"
          docker stop safira-test

      - name: Pipeline Complete
        run: |
          echo "================================"
          echo "   SAFIRA PIPELINE SUCCESS     "
          echo "================================"
          echo "✅ Code Check    - PASSED"
          echo "✅ File Check    - PASSED"
          echo "✅ Docker Build  - PASSED"
          echo "✅ App Test      - PASSED"
          echo "================================"
